<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>io-notes</title>
<meta name="description" content="Lightweight offline-first note-taking app.">
<meta name="theme-color" content="#fbfbfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="io-notes">
<link rel="manifest" href="/manifest.webmanifest?v=64">
<link rel="stylesheet" href="/app.css?v=64">
<link rel="icon" type="image/png" href="/favicon-io-notes.png">
<link rel="apple-touch-icon" href="/icon-note-192.png">
<script>
/* Apply the stored theme before first paint so there is no flash. */
try{var t=localStorage.getItem('io-notes-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<div id="app"><div class="loading"><span class="spinner"></span><span>Loading io-notes…</span></div></div>
<script src="/config.js"></script>
<script src="/app.js?v=64" defer></script>
</body>
</html>
